<!DOCTYPE html>
<html>

<head>

    <title>CampusIntel - Register</title>

    <link rel="stylesheet"
          href="{{ url_for(
          'static',
          filename='css/style.css'
          ) }}">

</head>

<body>

<div class="container">

    <h1>🎓 Student Registration</h1>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>

</html>
